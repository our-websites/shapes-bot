<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Example activity</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 16px/1.5 system-ui, sans-serif; }
  main { text-align: center; padding: 24px; }
  button { font: inherit; padding: 10px 18px; border-radius: 8px; border: 1px solid currentColor; background: none; color: inherit; cursor: pointer; }
</style>
</head>
<body>
<main>
  <h1>Example activity</h1>
  <p>Copy this folder to start a new one.</p>
  <button id="b">Clicked 0 times</button>
</main>
<script>
  let n = 0; const b = document.getElementById('b');
  b.onclick = () => { b.textContent = 'Clicked ' + (++n) + ' times'; };
</script>
</body>
</html>
