<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;800&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<title>Sign in · Shapes</title>
<style>
  :root { color-scheme: dark; --bg:#050505; --panel:#0d0d0f; --sunk:#0a0a0b; --ink:#ffffff; --muted:#9b9b9f; --line:rgba(160,160,170,.25);
    --accent:#6366f1; --accent-ink:#ffffff; --accent-soft:rgba(99,102,241,.2); --danger:#f2877f; --ok:#6fcf8d; --field:#08080a; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    display: grid; grid-template-rows: 1fr auto; -webkit-font-smoothing: antialiased;
  }
  main { display: grid; place-items: center; padding: 24px 16px; }
  .card { width: 100%; max-width: 360px; }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 28px; }
  .mark { width: 28px; height: 28px; border-radius: 7px; background: var(--ink); color: var(--bg);
          display: grid; place-items: center; font-weight: 700; font-size: 15px; letter-spacing: -.02em; }
  .brand span { font-weight: 600; letter-spacing: -.01em; }
  h1 { font-size: 22px; line-height: 1.25; margin: 0 0 6px; letter-spacing: -.015em; font-weight: 650; }
  p.sub { margin: 0 0 24px; color: var(--muted); }
  label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
  input {
    width: 100%; font: inherit; color: inherit; background: var(--field);
    border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px;
  }
  input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }
  button {
    margin-top: 16px; width: 100%; font: inherit; font-weight: 600; cursor: pointer;
    background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 8px; padding: 10px 14px;
  }
  button:hover { filter: brightness(1.06); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .error { margin: 0 0 14px; padding: 9px 12px; border-radius: 8px; font-size: 14px;
           border: 1px solid color-mix(in srgb, var(--danger) 40%, transparent);
           color: var(--danger); background: color-mix(in srgb, var(--danger) 8%, transparent); }
  footer { padding: 16px; text-align: center; color: var(--muted); font-size: 13px; }
  body { font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; }
  h1,h2,.brand span { font-family:"Poppins","Inter",sans-serif; }
  button.primary, button[type=submit] { background:linear-gradient(135deg,#6366f1,#4f46e5); color:#fff; }
  ::-webkit-scrollbar { width:12px; } ::-webkit-scrollbar-track { background:#050505; } ::-webkit-scrollbar-thumb { background:rgba(99,102,241,.4); border-radius:6px; border:3px solid #050505; }
  * { scrollbar-width:thin; scrollbar-color:rgba(99,102,241,.4) #050505; }
</style>
</head>
<body>
<main>
  <form class="card" method="post" autocomplete="off">
    <div class="brand"><div class="mark">S</div><span>Shapes</span></div>
    <h1>Sign in</h1>
    <p class="sub">Bot dashboard. Enter the admin key to continue.</p>
    {% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}
    <label for="pass">Admin key</label>
    <input id="pass" name="pass" type="password" required autofocus autocomplete="current-password">
    <button type="submit">Continue</button>
  </form>
</main>
<footer>Shapes on Yapin</footer>
</body>
</html>
